<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Warframe Relic Vault Checker</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0a0f;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem 1rem;
        }

        .container {
            max-width: 700px;
            width: 100%;
        }

        h1 {
            text-align: center;
            font-size: 1.8rem;
            font-weight: 700;
            color: #f5a623;
            margin-bottom: 0.3rem;
            letter-spacing: 0.5px;
        }

        h1 span { color: #e0e0e0; font-weight: 400; }

        .subtitle {
            text-align: center;
            color: #888;
            font-size: 0.85rem;
            margin-bottom: 2rem;
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            padding: 0.6rem 1rem;
            background: #14141e;
            border-radius: 8px;
            border: 1px solid #222;
            font-size: 0.8rem;
        }

        .status-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 6px;
            vertical-align: middle;
        }

        .status-dot.loading { background: #f5a623; animation: pulse 1s infinite; }
        .status-dot.ready { background: #4caf50; }
        .status-dot.error { background: #f44336; }

        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

        .status-stats { color: #888; }

        .tab-bar {
            display: flex;
            gap: 0;
            margin-bottom: 1.5rem;
        }

        .tab-btn {
            flex: 1;
            padding: 0.7rem;
            background: #14141e;
            border: 1px solid #222;
            color: #888;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .tab-btn:first-child { border-radius: 8px 0 0 8px; }
        .tab-btn:last-child { border-radius: 0 8px 8px 0; }

        .tab-btn.active {
            background: #1a1a2e;
            color: #f5a623;
            border-color: #f5a623;
        }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .input-group {
            position: relative;
            margin-bottom: 1rem;
        }

        input[type="text"], textarea {
            width: 100%;
            padding: 0.9rem 1rem;
            background: #14141e;
            border: 1px solid #333;
            border-radius: 8px;
            color: #e0e0e0;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
            font-family: inherit;
        }

        input:focus, textarea:focus { border-color: #f5a623; }

        textarea {
            min-height: 150px;
            resize: vertical;
            line-height: 1.6;
        }

        .autocomplete-list {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: #1a1a2e;
            border: 1px solid #333;
            border-top: none;
            border-radius: 0 0 8px 8px;
            max-height: 250px;
            overflow-y: auto;
            z-index: 10;
            display: none;
        }

        .autocomplete-list.show { display: block; }

        .autocomplete-item {
            padding: 0.6rem 1rem;
            cursor: pointer;
            font-size: 0.9rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .autocomplete-item:hover { background: #252540; }

        .autocomplete-item .badge {
            font-size: 0.7rem;
            padding: 2px 8px;
            border-radius: 4px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .badge.vaulted { background: #f4433622; color: #f44336; }
        .badge.active { background: #4caf5022; color: #4caf50; }

        .btn {
            width: 100%;
            padding: 0.9rem;
            background: #f5a623;
            border: none;
            border-radius: 8px;
            color: #0a0a0f;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            letter-spacing: 0.5px;
        }

        .btn:hover { background: #ffb733; transform: translateY(-1px); }
        .btn:active { transform: translateY(0); }

        .result-card {
            margin-top: 1.5rem;
            padding: 1.5rem;
            border-radius: 10px;
            display: none;
            text-align: center;
        }

        .result-card.show { display: block; }

        .result-card.vaulted {
            background: #f4433615;
            border: 1px solid #f4433644;
        }

        .result-card.not-vaulted {
            background: #4caf5015;
            border: 1px solid #4caf5044;
        }

        .result-card.not-found {
            background: #ff980015;
            border: 1px solid #ff980044;
        }

        .result-icon { font-size: 2.5rem; margin-bottom: 0.5rem; }

        .result-label {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 0.3rem;
        }

        .result-card.vaulted .result-label { color: #f44336; }
        .result-card.not-vaulted .result-label { color: #4caf50; }
        .result-card.not-found .result-label { color: #ff9800; }

        .result-relic {
            font-size: 1.1rem;
            color: #aaa;
            margin-bottom: 0.5rem;
        }

        .result-source {
            font-size: 0.75rem;
            color: #666;
            margin-bottom: 0.8rem;
        }

        .result-link {
            color: #f5a623;
            text-decoration: none;
            font-size: 0.9rem;
        }

        .result-link:hover { text-decoration: underline; }

        .batch-hint {
            font-size: 0.8rem;
            color: #666;
            margin-bottom: 1rem;
        }

        .batch-results {
            margin-top: 1.5rem;
        }

        .batch-results table {
            width: 100%;
            border-collapse: collapse;
            background: #14141e;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #222;
        }

        .batch-results th {
            background: #1a1a2e;
            padding: 0.7rem 1rem;
            text-align: left;
            font-size: 0.8rem;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .batch-results td {
            padding: 0.6rem 1rem;
            border-top: 1px solid #222;
            font-size: 0.9rem;
        }

        .batch-results tr:hover td { background: #1a1a2e; }

        .batch-badge {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .batch-badge.vaulted { background: #f4433622; color: #f44336; }
        .batch-badge.active { background: #4caf5022; color: #4caf50; }
        .batch-badge.not-found { background: #ff980022; color: #ff9800; }

        .batch-stats {
            margin-top: 1rem;
            display: flex;
            gap: 1rem;
            justify-content: center;
            font-size: 0.85rem;
            color: #888;
        }

        .batch-stats span { font-weight: 600; }

        .footer {
            margin-top: 3rem;
            text-align: center;
            font-size: 0.75rem;
            color: #444;
        }

        .footer a { color: #666; text-decoration: none; }
        .footer a:hover { color: #f5a623; }

        @media (max-width: 480px) {
            body { padding: 1rem 0.5rem; }
            h1 { font-size: 1.4rem; }
            .container { padding: 0 0.5rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Warframe Relic <span>Vault Checker</span></h1>
        <p class="subtitle">Check if a Void Relic is vaulted or currently in rotation</p>

        <div class="status-bar">
            <div>
                <span class="status-dot loading" id="statusDot"></span>
                <span id="statusText">Loading relic data...</span>
            </div>
            <div class="status-stats" id="statusStats"></div>
        </div>

        <div class="tab-bar">
            <button class="tab-btn active" onclick="switchTab('single')">Single Check</button>
            <button class="tab-btn" onclick="switchTab('batch')">Batch Check</button>
        </div>

        <div class="tab-content active" id="tab-single">
            <div class="input-group">
                <input type="text" id="relicInput" placeholder="e.g. Neo V10, Lith A1, Axi S3" autocomplete="off" disabled>
                <div class="autocomplete-list" id="autocomplete"></div>
            </div>
            <button class="btn" id="checkBtn" onclick="checkSingle()" disabled>Check Relic</button>
            <div class="result-card" id="resultCard">
                <div class="result-icon" id="resultIcon"></div>
                <div class="result-label" id="resultLabel"></div>
                <div class="result-relic" id="resultRelic"></div>
                <div class="result-source" id="resultSource"></div>
                <a class="result-link" id="resultLink" href="#" target="_blank">View on WARFRAME Wiki →</a>
            </div>
        </div>

        <div class="tab-content" id="tab-batch">
            <p class="batch-hint">Paste relic names, one per line</p>
            <textarea id="batchInput" placeholder="Neo V10&#10;Lith A1&#10;Axi S3&#10;Meso F2" disabled></textarea>
            <button class="btn" id="batchBtn" onclick="checkBatch()" disabled style="margin-top: 1rem;">Check All</button>
            <div class="batch-results" id="batchResults"></div>
        </div>

        <div class="footer">
            Data from <a href="https://wiki.warframe.com" target="_blank">WARFRAME Wiki</a> &middot; Not affiliated with Digital Extremes
        </div>
    </div>

<script>
const WIKI_API = 'https://wiki.warframe.com/api.php';

let vaultedSet = new Set();
let allRelics = [];
let loaded = false;

// --- Init ---
async function loadData() {
    const statusDot = document.getElementById('statusDot');
    const statusText = document.getElementById('statusText');
    const statusStats = document.getElementById('statusStats');

    try {
        statusText.textContent = 'Loading vaulted relics...';

        const vaulted = await fetchAllCategory('Category:Vaulted_Relics');
        vaultedSet = new Set(vaulted.map(r => r.title));
        statusStats.textContent = `${vaultedSet.size} vaulted loaded — fetching all relics...`;
        statusText.textContent = 'Loading all relics...';

        const all = await fetchAllCategory('Category:Relic', 'page');
        allRelics = all.map(r => r.title).sort();

        const activeCount = allRelics.length - vaultedSet.size;

        statusDot.className = 'status-dot ready';
        statusText.textContent = 'Ready';
        statusStats.textContent = `${allRelics.length} relics · ${vaultedSet.size} vaulted · ${activeCount} active`;

        document.getElementById('relicInput').disabled = false;
        document.getElementById('batchInput').disabled = false;
        document.getElementById('checkBtn').disabled = false;
        document.getElementById('batchBtn').disabled = false;
        loaded = true;
    } catch (err) {
        statusDot.className = 'status-dot error';
        statusText.textContent = 'Failed to load data — try refreshing';
        console.error(err);
    }
}

async function fetchJSON(url) {
    const res = await fetch(url);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    return res.json();
}

async function fetchAllCategory(category, type = '') {
    const members = [];
    let continueToken = null;

    do {
        const params = new URLSearchParams({
            action: 'query',
            list: 'categorymembers',
            cmtitle: category,
            cmlimit: '500',
            format: 'json'
        });
        if (type) params.set('cmtype', type);
        if (continueToken) params.set('cmcontinue', continueToken);

        const data = await fetchJSON(`${WIKI_API}?${params}`);
        members.push(...(data?.query?.categorymembers || []));
        continueToken = data?.continue?.cmcontinue || null;
    } while (continueToken);

    return members;
}

// --- Tabs ---
function switchTab(tab) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));

    document.getElementById(`tab-${tab}`).classList.add('active');
    event.target.classList.add('active');
}

// --- Autocomplete ---
const relicInput = document.getElementById('relicInput');
const autocomplete = document.getElementById('autocomplete');
let selectedIdx = -1;

relicInput.addEventListener('input', () => {
    const val = relicInput.value.trim().toLowerCase();
    selectedIdx = -1;

    if (!val || !loaded) {
        autocomplete.classList.remove('show');
        return;
    }

    const matches = allRelics.filter(r => r.toLowerCase().includes(val)).slice(0, 15);

    if (matches.length === 0) {
        autocomplete.classList.remove('show');
        return;
    }

    autocomplete.innerHTML = matches.map((r, i) => {
        const isVaulted = vaultedSet.has(r);
        const badgeClass = isVaulted ? 'vaulted' : 'active';
        const badgeText = isVaulted ? 'Vaulted' : 'Active';
        return `<div class="autocomplete-item" data-relic="${r}" onclick="selectRelic('${r}')">
            <span>${r}</span>
            <span class="badge ${badgeClass}">${badgeText}</span>
        </div>`;
    }).join('');

    autocomplete.classList.add('show');
});

relicInput.addEventListener('keydown', (e) => {
    const items = autocomplete.querySelectorAll('.autocomplete-item');
    if (!items.length) {
        if (e.key === 'Enter') { e.preventDefault(); checkSingle(); }
        return;
    }

    if (e.key === 'ArrowDown') {
        e.preventDefault();
        selectedIdx = Math.min(selectedIdx + 1, items.length - 1);
        highlightItem(items);
    } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        selectedIdx = Math.max(selectedIdx - 1, 0);
        highlightItem(items);
    } else if (e.key === 'Enter') {
        e.preventDefault();
        if (selectedIdx >= 0) {
            selectRelic(items[selectedIdx].dataset.relic);
        } else {
            checkSingle();
        }
    } else if (e.key === 'Escape') {
        autocomplete.classList.remove('show');
    }
});

function highlightItem(items) {
    items.forEach((item, i) => {
        item.style.background = i === selectedIdx ? '#252540' : '';
    });
}

function selectRelic(name) {
    relicInput.value = name;
    autocomplete.classList.remove('show');
    checkSingle();
}

document.addEventListener('click', (e) => {
    if (!e.target.closest('.input-group')) autocomplete.classList.remove('show');
});

// --- Single Check ---
function checkSingle() {
    if (!loaded) return;

    let name = relicInput.value.trim();
    if (!name) return;

    autocomplete.classList.remove('show');

    // Try exact match first, then case-insensitive
    let match = findRelic(name);

    const card = document.getElementById('resultCard');
    const icon = document.getElementById('resultIcon');
    const label = document.getElementById('resultLabel');
    const relic = document.getElementById('resultRelic');
    const source = document.getElementById('resultSource');
    const link = document.getElementById('resultLink');

    card.className = 'result-card show';

    if (!match) {
        card.classList.add('not-found');
        icon.textContent = '?';
        label.textContent = 'Relic Not Found';
        relic.textContent = name;
        source.textContent = 'Check the spelling and try again';
        link.href = `https://wiki.warframe.com/w/${encodeURIComponent(name)}`;
        return;
    }

    const isVaulted = vaultedSet.has(match);
    card.className = `result-card show ${isVaulted ? 'vaulted' : 'not-vaulted'}`;
    icon.textContent = isVaulted ? '🔒' : '✅';
    label.textContent = isVaulted ? 'VAULTED' : 'NOT VAULTED';
    relic.textContent = match;
    source.textContent = `Data source: WARFRAME Wiki API`;
    link.href = `https://wiki.warframe.com/w/${encodeURIComponent(match)}`;
}

function findRelic(input) {
    const lower = input.toLowerCase();
    // Exact match
    if (allRelics.includes(input)) return input;
    // Case-insensitive
    const ci = allRelics.find(r => r.toLowerCase() === lower);
    if (ci) return ci;
    // Partial match
    const partial = allRelics.find(r => r.toLowerCase() === lower || r.toLowerCase().startsWith(lower));
    return partial || null;
}

// --- Batch Check ---
function checkBatch() {
    if (!loaded) return;

    const textarea = document.getElementById('batchInput');
    const lines = textarea.value.split('\n').map(l => l.trim()).filter(l => l.length > 0);

    if (lines.length === 0) return;

    let vaultedCount = 0;
    let activeCount = 0;
    let notFoundCount = 0;

    const rows = lines.map(name => {
        const match = findRelic(name);
        if (!match) {
            notFoundCount++;
            return { input: name, display: name, status: 'not-found', statusText: 'Not Found' };
        }
        const isVaulted = vaultedSet.has(match);
        if (isVaulted) vaultedCount++;
        else activeCount++;
        return {
            input: name,
            display: match,
            status: isVaulted ? 'vaulted' : 'active',
            statusText: isVaulted ? 'Vaulted' : 'Active'
        };
    });

    const resultsDiv = document.getElementById('batchResults');
    resultsDiv.innerHTML = `
        <table>
            <thead>
                <tr>
                    <th>Relic</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody>
                ${rows.map(r => `
                    <tr>
                        <td>
                            <a href="https://wiki.warframe.com/w/${encodeURIComponent(r.display)}" target="_blank" style="color: #e0e0e0; text-decoration: none;">
                                ${r.display}
                            </a>
                        </td>
                        <td>
                            <span class="batch-badge ${r.status}">${r.statusText}</span>
                        </td>
                    </tr>
                `).join('')}
            </tbody>
        </table>
        <div class="batch-stats">
            ${vaultedCount > 0 ? `<div><span style="color:#f44336">${vaultedCount}</span> vaulted</div>` : ''}
            ${activeCount > 0 ? `<div><span style="color:#4caf50">${activeCount}</span> active</div>` : ''}
            ${notFoundCount > 0 ? `<div><span style="color:#ff9800">${notFoundCount}</span> not found</div>` : ''}
        </div>
    `;
}

// --- Start ---
loadData();
</script>
</body>
</html>
